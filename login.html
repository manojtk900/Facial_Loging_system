<!DOCTYPE html>
<html>
<head>
    <title>Biometric Login</title>

    <script>
        setInterval(function(){
            fetch('/status')
            .then(response => response.text())
            .then(user => {
                if(user){
                    document.body.innerHTML = `
                        <div class="success-screen">
                            <div class="tick">✔</div>
                            <h1>Welcome ${user}</h1>
                            <p>Authentication Successful</p>
                        </div>
                    `;
                }
            });
        }, 1000);
    </script>

    <style>
        body {
            margin: 0;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .header {
            background: #1a237e;
            color: white;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .subtext {
            margin-top: 20px;
            color: #444;
            font-size: 18px;
        }

        .camera-wrapper {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .camera-circle {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #ff3d00;
            box-shadow: 0 0 25px rgba(255,0,0,0.6);
            animation: pulse 2s infinite;
        }

        .camera-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 30px rgba(255,0,0,1); }
            100% { box-shadow: 0 0 10px rgba(255,0,0,0.4); }
        }

        .success-screen {
            margin-top: 150px;
        }

        .tick {
            font-size: 80px;
            color: green;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="header">
        🇮🇳 Aadhaar Biometric Authentication
    </div>

    <div class="subtext">
        Please Blink to Capture
    </div>

    <div class="camera-wrapper">
        <div class="camera-circle">
            <img src="{{ url_for('video') }}">
        </div>
    </div>

</body>
</html>
